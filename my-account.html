<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Account | ArtisanConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">AC</div>
        <div class="logo-text">
          <h1>Artisan<span>Connect</span></h1>
          <p>My Account</p>
        </div>
      </a>
    </div>
  </header>

  <main style="padding:120px 0 40px;">
    <div class="container" style="display:grid;gap:20px;">
      <div class="card" style="padding:24px;">
        <h1>My Profile</h1>
        <div id="myProfileBox"></div>
      </div>

      <div class="card" style="padding:24px;display:none;" id="myInboxCard">
        <h2><i class="fas fa-inbox"></i> Artisan Inbox</h2>
        <div id="myInboxBox"></div>
      </div>

      <div class="card" style="padding:24px;display:none;" id="myFollowersCard">
        <h2><i class="fas fa-user-group"></i> Followers</h2>
        <div id="myFollowersBox"></div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script type="module" src="js/my-account.js"></script>
</body>
</html>
