<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login / Signup | ArtisanConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">AC</div>
        <div class="logo-text">
          <h1>Artisan<span>Connect</span></h1>
          <p>Bridging Crafts and Community</p>
        </div>
      </a>
    </div>
  </header>

  <main style="padding:120px 0 40px;">
    <div class="container" style="max-width:500px;">
      <div class="card" style="padding:24px;">
        <h1 id="authTitle">Login</h1>
        <p id="authSubtitle">Login to continue</p>

        <div style="display:flex;gap:10px;margin:18px 0;">
          <button class="btn btn-outline" id="showLoginBtn" type="button">Login</button>
          <button class="btn btn-outline" id="showSignupBtn" type="button">Sign Up</button>
        </div>

        <form id="authForm">
          <div style="display:grid;gap:12px;">
            <div id="nameWrap" style="display:none;">
              <label for="authName">Full Name</label>
              <input id="authName" class="form-control" type="text">
            </div>

            <div>
              <label for="authEmail">Email</label>
              <input id="authEmail" class="form-control" type="email" required>
            </div>

            <div>
              <label for="authPassword">Password</label>
              <input id="authPassword" class="form-control" type="password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="authSubmitBtn">Login</button>
            <button type="button" class="btn btn-outline btn-full" id="googleLoginBtn">Continue with Google</button>
            <button type="button" class="btn btn-outline btn-full" id="resetPasswordBtn">Forgot Password?</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
