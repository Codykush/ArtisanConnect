<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Artisan Profile | ArtisanConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/theme-marketplace.css">
</head>
<body class="profile-page">
  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">AC</div>
        <div class="logo-text">
          <h1>Artisan<span>Connect</span></h1>
          <p>Artisan Profile</p>
        </div>
      </a>

      <nav class="main-nav" id="mainNav">
        <ul>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="artisans.html" class="nav-link">Discover Artisans</a></li>
          <li><a href="about.html" class="nav-link">Our Mission</a></li>
          <li><a href="my-account.html" class="nav-link" data-requires-auth="true" data-redirect="my-account.html">My Account</a></li>
        </ul>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="profile-hero" style="padding-top:120px;">
      <div class="container">
        <a href="artisans.html" class="btn btn-outline" style="margin-bottom:18px;display:inline-flex;align-items:center;gap:8px;">
          <i class="fas fa-arrow-left"></i>
          Back to Artisans
        </a>
        <div id="profileMain"></div>
      </div>
    </section>

    <section class="profile-main-grid">
      <div class="container">
        <div class="grid-container">
          <div class="left-column">
            <section class="card-section">
              <div class="section-header">
                <h2><i class="fas fa-user-circle"></i> About the Artisan</h2>
              </div>
              <div class="card-content">
                <div id="artisanDescription"></div>
                <div style="margin-top:20px;">
                  <h3><i class="fas fa-tools"></i> Skills & Techniques</h3>
                  <div id="skillsList" class="tags-container" style="margin-top:12px;"></div>
                </div>
              </div>
            </section>
          </div>

          <div class="right-column">
            <div class="sticky-sidebar">
              <div class="widget-card">
                <div class="widget-header">
                  <h3><i class="fas fa-envelope"></i> Contact Information</h3>
                </div>
                <div class="widget-content">
                  <div id="contactInfo"></div>
                </div>
              </div>

              <div class="widget-card">
                <div class="widget-header">
                  <h3><i class="fas fa-images"></i> Gallery</h3>
                </div>
                <div class="widget-content">
                  <div id="galleryGrid" class="gallery-grid"></div>
                </div>
              </div>

              <div class="widget-card">
                <div class="widget-header">
                  <h3><i class="fas fa-shopping-bag"></i> Products</h3>
                </div>
                <div class="widget-content">
                  <div id="productsList"></div>
                </div>
              </div>

              <div class="widget-card" id="ownerInboxCard" style="display:none;">
                <div class="widget-header">
                  <h3><i class="fas fa-inbox"></i> Inbox</h3>
                </div>
                <div class="widget-content">
                  <div id="ownerInboxSummary"></div>
                  <div id="ownerInboxList"></div>
                </div>
              </div>

              <div class="widget-card" id="ownerFollowersCard" style="display:none;">
                <div class="widget-header">
                  <h3><i class="fas fa-user-group"></i> Followers</h3>
                </div>
                <div class="widget-content">
                  <div id="ownerFollowersList"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="main-footer"></footer>

  <script src="js/main.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
